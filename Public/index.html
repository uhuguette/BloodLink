<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink Rwanda</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>BloodLink Rwanda</h1>
        <p>Connecting blood donors with people who need them.</p>
    </header>

    <main>
        <section id="search-section">
            <h2>Find a Blood Donor</h2>

            <form id="searchForm">
                <label for="searchBloodType">Blood Type</label>
                <select id="searchBloodType" required>
                    <option value="">Select blood type</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>

                <label for="searchDistrict">District</label>
<select id="searchDistrict" required>
    <option value="">Select district</option>

    <optgroup label="Kigali City">
        <option value="Gasabo">Gasabo</option>
        <option value="Kicukiro">Kicukiro</option>
        <option value="Nyarugenge">Nyarugenge</option>
    </optgroup>

    <optgroup label="Eastern Province">
        <option value="Bugesera">Bugesera</option>
        <option value="Gatsibo">Gatsibo</option>
        <option value="Kayonza">Kayonza</option>
        <option value="Kirehe">Kirehe</option>
        <option value="Ngoma">Ngoma</option>
        <option value="Nyagatare">Nyagatare</option>
        <option value="Rwamagana">Rwamagana</option>
    </optgroup>

    <optgroup label="Northern Province">
        <option value="Burera">Burera</option>
        <option value="Gakenke">Gakenke</option>
        <option value="Gicumbi">Gicumbi</option>
        <option value="Musanze">Musanze</option>
        <option value="Rulindo">Rulindo</option>
    </optgroup>

    <optgroup label="Southern Province">
        <option value="Gisagara">Gisagara</option>
        <option value="Huye">Huye</option>
        <option value="Kamonyi">Kamonyi</option>
        <option value="Muhanga">Muhanga</option>
        <option value="Nyamagabe">Nyamagabe</option>
        <option value="Nyanza">Nyanza</option>
        <option value="Nyaruguru">Nyaruguru</option>
        <option value="Ruhango">Ruhango</option>
    </optgroup>

    <optgroup label="Western Province">
        <option value="Karongi">Karongi</option>
        <option value="Ngororero">Ngororero</option>
        <option value="Nyabihu">Nyabihu</option>
        <option value="Nyamasheke">Nyamasheke</option>
        <option value="Rubavu">Rubavu</option>
        <option value="Rusizi">Rusizi</option>
        <option value="Rutsiro">Rutsiro</option>
    </optgroup>
</select>

                <button type="submit">Search Donors</button>
            </form>

            <div id="searchResults"></div>
        </section>

        <section id="registration-section">
            <h2>Become a Blood Donor</h2>

            <form id="registrationForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="07XXXXXXXX" required>
                <small id="phoneError" class="error-message"></small>

                <label for="bloodType">Blood Type</label>
                <select id="bloodType" required>
                    <option value="">Select blood type</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>

                <label for="district">District</label>
                <select id="district" required>
    <option value="">Select district</option>

    <optgroup label="Kigali City">
        <option value="Gasabo">Gasabo</option>
        <option value="Kicukiro">Kicukiro</option>
        <option value="Nyarugenge">Nyarugenge</option>
    </optgroup>

    <optgroup label="Eastern Province">
        <option value="Bugesera">Bugesera</option>
        <option value="Gatsibo">Gatsibo</option>
        <option value="Kayonza">Kayonza</option>
        <option value="Kirehe">Kirehe</option>
        <option value="Ngoma">Ngoma</option>
        <option value="Nyagatare">Nyagatare</option>
        <option value="Rwamagana">Rwamagana</option>
    </optgroup>

    <optgroup label="Northern Province">
        <option value="Burera">Burera</option>
        <option value="Gakenke">Gakenke</option>
        <option value="Gicumbi">Gicumbi</option>
        <option value="Musanze">Musanze</option>
        <option value="Rulindo">Rulindo</option>
    </optgroup>

    <optgroup label="Southern Province">
        <option value="Gisagara">Gisagara</option>
        <option value="Huye">Huye</option>
        <option value="Kamonyi">Kamonyi</option>
        <option value="Muhanga">Muhanga</option>
        <option value="Nyamagabe">Nyamagabe</option>
        <option value="Nyanza">Nyanza</option>
        <option value="Nyaruguru">Nyaruguru</option>
        <option value="Ruhango">Ruhango</option>
    </optgroup>

    <optgroup label="Western Province">
        <option value="Karongi">Karongi</option>
        <option value="Ngororero">Ngororero</option>
        <option value="Nyabihu">Nyabihu</option>
        <option value="Nyamasheke">Nyamasheke</option>
        <option value="Rubavu">Rubavu</option>
        <option value="Rusizi">Rusizi</option>
        <option value="Rutsiro">Rutsiro</option>
    </optgroup>
</select>

                <label>
                    <input type="checkbox" id="consent" required>
                    I agree to share my contact information with people searching for donors.
                </label>

                <button type="submit">Register as Donor</button>
            </form>

            <div id="registrationMessage"></div>
        </section>
    </main>

    <footer>
        <p>BloodLink Rwanda | A student project prototype</p>
    </footer>

    <script src="js/register.js"></script>
</body>
</html>
