<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink Rwanda - Find a Donor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">♥</span>
            <span class="logo-text">
                <strong>BloodLink</strong>
                <small>Rwanda Blood Network</small>
            </span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html" data-translate="home">Home</a></li>
            <li><a href="index.html#how-it-works" data-translate="howItWorks">How It Works</a></li>
            <li><a href="index.html#help" data-translate="help">Help</a></li>
            <li><a href="register.html" data-translate="getInvolved">Get Involved</a></li>
        </ul>

        <div class="nav-actions">
            <select class="language-selector" id="languageSelector" aria-label="Language">
                <option value="en">EN</option>
                <option value="rw">RW</option>
            </select>
            <a href="search.html" class="nav-button" data-translate="findDonor">Find a Donor</a>
            <a href="register.html" class="nav-button nav-register" data-translate="donate">Donate</a>
        </div>
    </nav>
</header>

<main class="page">
    <!-- Search form (FR 2) -->
    <section class="card">
        <h2 data-translate="searchTitle">Find a Blood Donor</h2>
        <p class="card-intro" data-translate="searchIntro"></p>

        <form id="searchForm" class="search-form" novalidate>
            <div class="field">
                <label for="bloodType" data-translate="labelBloodType">Blood type</label>
                <select id="bloodType" name="bloodType" required></select>
            </div>

            <div class="field">
                <label for="district" data-translate="labelDistrict">District</label>
                <select id="district" name="district" required></select>
            </div>

            <button type="submit" data-translate="searchButton">Search</button>
        </form>

        <p class="form-message" id="searchMessage" role="status" hidden></p>
    </section>

    <!-- Results (FR 3) -->
    <section class="card" id="results" hidden aria-live="polite"></section>

    <!-- RCBT list (FR 4) -->
    <section class="card">
        <h2 data-translate="rcbtTitle">Official Blood Transfusion Centres (RCBT)</h2>
        <p class="card-intro" data-translate="rcbtIntro"></p>
        <ul class="rcbt-list" id="rcbtList"></ul>
    </section>
</main>

<footer>
    <p data-translate="footerTitle">BloodLink Rwanda | A student project prototype</p>
    <p data-translate="footerText">Connecting donors, supporting communities.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/language.js"></script>
<script src="js/search.js"></script>
</body>
</html>
